<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bulk UserID & Ticket Generator</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Consolas, monospace;
}

body{
background:#0b1020;
padding:20px;
color:#fff;
}

.container{
max-width:1200px;
margin:auto;
}

.card{
background:#101827;
border:2px solid #ff2d7a;
border-radius:15px;
overflow:hidden;
}

.header{
background:#ff2d7a;
padding:15px;
font-size:22px;
font-weight:bold;
text-align:center;
}

.content{
padding:20px;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
}

textarea{
width:100%;
height:350px;
background:#050b18;
border:1px solid #374151;
border-radius:10px;
padding:15px;
color:#fff;
resize:none;
}

.buttons{
margin-top:15px;
display:flex;
gap:10px;
}

button{
padding:12px 20px;
border:none;
border-radius:8px;
cursor:pointer;
font-weight:bold;
}

.generate{
background:#22c55e;
color:white;
}

.copy{
background:#3b82f6;
color:white;
}

.clear{
background:#ef4444;
color:white;
}

.output{
margin-top:20px;
background:#050b18;
border:1px solid #ff2d7a;
border-radius:10px;
padding:15px;
min-height:300px;
white-space:pre-wrap;
color:#ff6b9d;
overflow:auto;
}

.info{
margin-top:10px;
color:#9ca3af;
}
</style>
</head>
<body>

<div class="container">
<div class="card">

<div class="header">
Bulk UserID + Ticket Generator
</div>

<div class="content">

<div class="grid">

<div>
<h3>User ID</h3>
<textarea id="userid"
placeholder="1 User ID per baris"></textarea>
</div>

<div>
<h3>Kode Tiket</h3>
<textarea id="txid"
placeholder="1 Kode Tiket per baris"></textarea>
</div>

</div>

<div class="buttons">
<button class="generate" onclick="generateData()">Generate</button>
<button class="copy" onclick="copyResult()">Copy Hasil</button>
<button class="clear" onclick="clearAll()">Hapus Semua</button>
</div>

<div class="info" id="counter">
Total Data : 0
</div>

<div class="output" id="hasil"></div>

</div>
</div>
</div>

<script>

function generateData(){

let users=document.getElementById('userid')
.value
.split('\n')
.map(x=>x.trim())
.filter(x=>x!='');

let txids=document.getElementById('txid')
.value
.split('\n')
.map(x=>x.trim())
.filter(x=>x!='');

if(users.length!==txids.length){

alert(
'Jumlah User ID ('+
users.length+
') dan Kode Tiket ('+
txids.length+
') harus sama.'
);

return;
}

let hasil=[];

for(let i=0;i<users.length;i++){
hasil.push(users[i]+', '+txids[i]);
}

document.getElementById('hasil').textContent=
hasil.join('\n');

document.getElementById('counter').textContent=
'Total Data : '+hasil.length;
}

function copyResult(){

let text=document.getElementById('hasil').textContent;

if(text===''){
alert('Belum ada hasil');
return;
}

navigator.clipboard.writeText(text);

alert('Berhasil disalin');
}

function clearAll(){

document.getElementById('userid').value='';
document.getElementById('txid').value='';
document.getElementById('hasil').textContent='';
document.getElementById('counter').textContent='Total Data : 0';

}
</script>

</body>
</html>
