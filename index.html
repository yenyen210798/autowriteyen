<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bulk UserID & Ticket Generator</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Consolas,monospace;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    background:url('https://images.unsplash.com/photo-1506744038136-46273834b3fb')
    center center/cover no-repeat fixed;
}

.container{
    width:100%;
    max-width:1200px;
}

.card{
    background:rgba(10,15,25,.80);
    backdrop-filter:blur(15px);
    border:2px solid #ff2d7a;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 0 30px rgba(255,45,122,.3);
}

.header{
    background:#ff2d7a;
    color:#fff;
    text-align:center;
    padding:18px;
    font-size:24px;
    font-weight:bold;
}

.content{
    padding:20px;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

@media(max-width:768px){
    .grid{
        grid-template-columns:1fr;
    }
}

h3{
    color:#fff;
    margin-bottom:10px;
}

textarea{
    width:100%;
    height:320px;
    background:#050b18;
    color:#fff;
    border:1px solid #444;
    border-radius:10px;
    padding:15px;
    resize:none;
    outline:none;
}

textarea:focus{
    border-color:#ff2d7a;
}

.buttons{
    margin-top:20px;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

button{
    border:none;
    border-radius:10px;
    padding:12px 20px;
    cursor:pointer;
    font-weight:bold;
    color:#fff;
}

.generate{
    background:#22c55e;
}

.copy{
    background:#3b82f6;
}

.clear{
    background:#ef4444;
}

.bg-btn{
    position:fixed;
    top:20px;
    right:20px;
    z-index:999;
    background:#ff2d7a;
}

.counter{
    margin-top:15px;
    color:#d1d5db;
}

.output{
    margin-top:15px;
    min-height:250px;
    background:#020817;
    border:1px solid #ff2d7a;
    border-radius:10px;
    padding:15px;
    color:#ff6b9d;
    white-space:pre-wrap;
    overflow:auto;
}

.footer{
    margin-top:15px;
    text-align:center;
    color:#9ca3af;
    font-size:13px;
}

.toast{
    position:fixed;
    bottom:20px;
    right:20px;
    background:#22c55e;
    color:#fff;
    padding:12px 20px;
    border-radius:10px;
    z-index:9999;
    animation:fadeIn .3s ease;
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(10px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

</style>
</head>
<body>

<input type="file" id="bgUpload" accept="image/*" hidden>

<button class="bg-btn"
onclick="document.getElementById('bgUpload').click()">
📷 Ganti Background
</button>

<div class="container">

<div class="card">

<div class="header">
Bulk UserID & Ticket Generator
</div>

<div class="content">

<div class="grid">

<div>
<h3>User ID</h3>
<textarea id="userid"
placeholder="1 User ID per baris"></textarea>
</div>

<div>
<h3>Kode Tiket</h3>
<textarea id="txid"
placeholder="1 Kode Tiket per baris"></textarea>
</div>

</div>

<div class="buttons">

<button class="generate"
onclick="generateData()">
⚡ Generate
</button>

<button class="copy"
id="copyBtn"
onclick="copyResult()">
📋 Copy Hasil
</button>

<button class="clear"
onclick="clearAll()">
🗑 Hapus Semua
</button>

</div>

<div class="counter" id="counter">
Total Data : 0
</div>

<div class="output" id="hasil"></div>

<div class="footer">
Format Output : userid, kode_tiket
</div>

</div>

</div>

</div>

<script>

function generateData(){

    let users =
    document.getElementById('userid')
    .value
    .split('\n')
    .map(x=>x.trim())
    .filter(x=>x!=='');

    let txids =
    document.getElementById('txid')
    .value
    .split('\n')
    .map(x=>x.trim())
    .filter(x=>x!=='');

    if(users.length !== txids.length){

        showToast(
        'Jumlah User ID dan Kode Tiket harus sama'
        );

        return;
    }

    let hasil=[];

    for(let i=0;i<users.length;i++){

        hasil.push(
        users[i] + ', ' + txids[i]
        );

    }

    document.getElementById('hasil')
    .textContent =
    hasil.join('\n');

    document.getElementById('counter')
    .textContent =
    'Total Data : ' + hasil.length;
}

async function copyResult(){

    const text =
    document.getElementById('hasil')
    .textContent;

    if(text==='') return;

    try{

        await navigator.clipboard.writeText(text);

        const btn =
        document.getElementById('copyBtn');

        const oldText =
        btn.innerHTML;

        btn.innerHTML =
        '✅ Berhasil Dicopy';

        setTimeout(()=>{
            btn.innerHTML = oldText;
        },2000);

        showToast('✅ Hasil berhasil dicopy');

    }catch(error){

        console.log(error);

    }

}

function clearAll(){

    document.getElementById('userid').value='';
    document.getElementById('txid').value='';
    document.getElementById('hasil').textContent='';
    document.getElementById('counter').textContent='Total Data : 0';

    showToast('🗑 Data berhasil dihapus');

}

function showToast(message){

    const toast =
    document.createElement('div');

    toast.className='toast';
    toast.innerHTML=message;

    document.body.appendChild(toast);

    setTimeout(()=>{
        toast.remove();
    },2000);

}

document
.getElementById('bgUpload')
.addEventListener('change',function(e){

    const file =
    e.target.files[0];

    if(!file) return;

    const reader =
    new FileReader();

    reader.onload=function(event){

        document.body.style.background=
        `url(${event.target.result}) center center/cover no-repeat fixed`;

        showToast('📷 Background berhasil diganti');

    };

    reader.readAsDataURL(file);

});

</script>

</body>
</html>
