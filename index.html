<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bulk UserID & Ticket Generator</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Consolas, monospace;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;

    background:url('https://images.unsplash.com/photo-1506744038136-46273834b3fb')
    center center/cover no-repeat fixed;
}

.container{
    width:100%;
    max-width:1200px;
}

.card{
    background:rgba(10,15,25,.78);
    backdrop-filter:blur(15px);
    border:2px solid #ff2d7a;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 0 30px rgba(255,45,122,.35);
}

.header{
    background:#ff2d7a;
    color:#fff;
    text-align:center;
    padding:18px;
    font-size:24px;
    font-weight:bold;
}

.content{
    padding:20px;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

@media(max-width:768px){
    .grid{
        grid-template-columns:1fr;
    }
}

h3{
    margin-bottom:8px;
    color:#fff;
}

textarea{
    width:100%;
    height:320px;
    background:#050b18;
    border:1px solid #444;
    border-radius:10px;
    color:#fff;
    padding:15px;
    resize:none;
    outline:none;
}

textarea:focus{
    border-color:#ff2d7a;
}

.buttons{
    margin-top:20px;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

button{
    border:none;
    border-radius:10px;
    padding:12px 20px;
    cursor:pointer;
    font-weight:bold;
}

.generate{
    background:#22c55e;
    color:white;
}

.copy{
    background:#3b82f6;
    color:white;
}

.clear{
    background:#ef4444;
    color:white;
}

.bg-btn{
    position:fixed;
    top:20px;
    right:20px;
    z-index:999;
    background:#ff2d7a;
    color:white;
    border:none;
    border-radius:10px;
    padding:12px 18px;
    cursor:pointer;
}

.counter{
    margin-top:15px;
    color:#d1d5db;
}

.output{
    margin-top:15px;
    min-height:250px;
    background:#020817;
    border:1px solid #ff2d7a;
    border-radius:10px;
    padding:15px;
    color:#ff6b9d;
    white-space:pre-wrap;
    overflow:auto;
}

.footer{
    margin-top:10px;
    text-align:center;
    color:#9ca3af;
    font-size:13px;
}

</style>
</head>
<body>

<input type="file" id="bgUpload" accept="image/*" hidden>

<button class="bg-btn"
onclick="document.getElementById('bgUpload').click()">
📷 Ganti Background
</button>

<div class="container">

<div class="card">

<div class="header">
Bulk UserID & Ticket Generator
</div>

<div class="content">

<div class="grid">

<div>
<h3>User ID</h3>
<textarea
id="userid"
placeholder="1 User ID per baris

contoh:
Ishak89
asstrea
syahida"></textarea>
</div>

<div>
<h3>Kode Tiket</h3>
<textarea
id="txid"
placeholder="1 Kode Tiket per baris

contoh:
206035905911234560
206035930296016090
206028076915847045"></textarea>
</div>

</div>

<div class="buttons">

<button class="generate"
onclick="generateData()">
⚡ Generate
</button>

<button class="copy"
onclick="copyResult()">
📋 Copy Hasil
</button>

<button class="clear"
onclick="clearAll()">
🗑 Hapus Semua
</button>

</div>

<div class="counter" id="counter">
Total Data : 0
</div>

<div class="output" id="hasil"></div>

<div class="footer">
Format Output : userid, kode_tiket
</div>

</div>
</div>
</div>

<script>

function generateData(){

let users =
document.getElementById('userid')
.value
.split('\n')
.map(x=>x.trim())
.filter(x=>x !== '');

let txids =
document.getElementById('txid')
.value
.split('\n')
.map(x=>x.trim())
.filter(x=>x !== '');

if(users.length !== txids.length){

alert(
'Jumlah User ID (' +
users.length +
') dan Kode Tiket (' +
txids.length +
') harus sama.'
);

return;
}

let hasil=[];

for(let i=0;i<users.length;i++){

hasil.push(
users[i] + ', ' + txids[i]
);

}

document.getElementById('hasil')
.textContent =
hasil.join('\n');

document.getElementById('counter')
.textContent =
'Total Data : ' + hasil.length;
}

function copyResult(){

let text =
document.getElementById('hasil')
.textContent;

if(text === ''){

alert('Belum ada hasil');
return;

}

navigator.clipboard.writeText(text);

alert('Hasil berhasil disalin');
}

function clearAll(){

if(!confirm('Hapus semua data?')){
return;
}

document.getElementById('userid').value='';
document.getElementById('txid').value='';
document.getElementById('hasil').textContent='';
document.getElementById('counter').textContent='Total Data : 0';

}

document
.getElementById('bgUpload')
.addEventListener('change',function(e){

const file = e.target.files[0];

if(!file) return;

const reader = new FileReader();

reader.onload = function(event){

document.body.style.background =
`url(${event.target.result}) center center/cover no-repeat fixed`;

};

reader.readAsDataURL(file);

});

</script>

</body>
</html>
